#
# INTRA / SHM / RTPS(DDS). Cross-host needs AUTOLINK_ENABLE_FASTDDS and/or
# AUTOLINK_ENABLE_CYCLONEDDS. If preferred vendor is stub and env unset, AMW
# auto-selects a real builtin (FastDDS then Cyclone). DIFF_HOST never falls
# back to SHM when RTPS is unavailable.
transport_conf {
  participant_attr {
    lease_duration: 12
    announcement_period: 3
    domain_id_gain: 200
    port_base: 10000
  }
  communication_mode {
    same_proc: INTRA
    diff_proc: SHM
    diff_host: RTPS
  }
  resource_limit {
    max_history_depth: 1000
  }
  # Preferred vendor; if stub and env unset, AMW auto-picks a real builtin.
  amw_conf {
    implementation: "amw_fastdds"
    default_network_provider: "fastdds"
  }
  shm_conf {
    notifier_type: "condition"
    shm_type: "xsi"
    arena_shm_conf {
      arena_channel_conf {
        channel_name: "/autolink/msg"
        max_msg_size: 33554432
        max_pool_size: 32
      }
    }
  }
}

run_mode_conf {
    run_mode: MODE_REALITY
    clock_mode: MODE_AUTOLINK
}

scheduler_conf {
    routine_num: 100
    default_proc_num: 16
}
