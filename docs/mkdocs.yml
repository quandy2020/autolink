# MkDocs 配置：文档源目录为 source/
site_name: Autolink
docs_dir: source
site_dir: site
theme:
  name: material
  language: zh
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: 深色
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: 浅色
plugins:
  - search
nav:
  - 首页: index.md
  - 入门:
      - 快速开始: guide/quickstart.md
      - 术语: guide/terms.md
      - POD 消息: guide/pod_message.md
      - 调度器: guide/scheduler.md
  - API:
      - C++: api/cpp.md
      - Python: api/python.md
  - 中间件:
      - AMW: amw/overview.md
  - 工具:
      - CLI: tools/cli.md
  - 常见问题: faq.md
